name: Build Yuclid C++

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main
    paths:
      - "yuclid/**"
      - ".github/workflows/compile-cpp.yml"
      - ".github/scripts/build-boost-macos.sh"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build_and_test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC
            os: ubuntu-latest
            cxx_compiler: g++-14
            compiler_package: g++-14

          - name: Linux Clang
            os: ubuntu-latest
            cxx_compiler: clang++-19
            compiler_package: clang-19

          - name: macOS GCC
            os: macos-15
            cxx_compiler: g++-14

          - name: Windows MSVC
            os: windows-2025
            cxx_compiler: cl

    env:
      BUILD_TYPE: RelWithDebInfo
      BOOST_VERSION: 1.87.0
      BOOST_INSTALL_DIR: .boost-gcc
      # Bump this when the Boost library set or build flags change.
      # This forces GitHub Actions to rebuild the cached GCC-built Boost tree.
      BOOST_CACHE_VERSION: v2

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libboost-all-dev \
            ${{ matrix.compiler_package }}

      # Yuclid needs GCC's C++23 <generator> support on macOS.
      # Build Boost with the same compiler to avoid mixing libc++ and libstdc++.
      - name: Install Dependencies macOS
        if: runner.os == 'macOS'
        env:
          MACOSX_DEPLOYMENT_TARGET: "15.0"
        run: |
          brew update
          brew install cmake gcc@14
          echo "$(brew --prefix gcc@14)/bin" >> "$GITHUB_PATH"
          echo 'MACOSX_DEPLOYMENT_TARGET=15.0' >> "$GITHUB_ENV"

      - name: Restore macOS Boost GCC cache
        if: runner.os == 'macOS'
        id: restore-macos-boost
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.BOOST_INSTALL_DIR }}
          key: macos-15-boost-${{ env.BOOST_VERSION }}-gcc14-${{ env.BOOST_CACHE_VERSION }}-${{ runner.arch }}

      - name: Build Boost with GCC on macOS
        if: runner.os == 'macOS' && steps.restore-macos-boost.outputs.cache-hit != 'true'
        run: bash .github/scripts/build-boost-macos.sh

      - name: Save macOS Boost GCC cache
        if: runner.os == 'macOS' && steps.restore-macos-boost.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.BOOST_INSTALL_DIR }}
          key: macos-15-boost-${{ env.BOOST_VERSION }}-gcc14-${{ env.BOOST_CACHE_VERSION }}-${{ runner.arch }}

      - name: Update vcpkg
        if: runner.os == 'Windows'
        shell: pwsh
        run: vcpkg update

      - name: Configure and Build CMake Project
        if: runner.os != 'macOS'
        uses: threeal/cmake-action@v2.1.0
        with:
          source-dir: yuclid
          cxx-compiler: ${{ matrix.cxx_compiler }}
          build-dir: build
          build-args: "--config ${{ env.BUILD_TYPE }}"
          options: |
            CMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
            BUILD_DOC=OFF
            ${{ runner.os == 'Windows' && 'CMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake' || '' }}

      # Force CMake to use the GCC-built Boost tree from .boost-gcc.
      # Without Boost_NO_SYSTEM_PATHS, CMake may silently pick Homebrew/system
      # Boost and reintroduce the macOS ABI mismatch.
      - name: Configure and Build Yuclid macOS
        if: runner.os == 'macOS'
        run: |
          set -euxo pipefail

          BOOST_ROOT="$GITHUB_WORKSPACE/${BOOST_INSTALL_DIR}"
          GCC_PREFIX="$(brew --prefix gcc@14)"

          cmake yuclid -B build \
            -DCMAKE_CXX_COMPILER="${GCC_PREFIX}/bin/g++-14" \
            -DCMAKE_BUILD_TYPE="${BUILD_TYPE}" \
            -DBUILD_DOC=OFF \
            -DBoost_ROOT="${BOOST_ROOT}" \
            -DBOOST_ROOT="${BOOST_ROOT}" \
            -DCMAKE_PREFIX_PATH="${BOOST_ROOT}" \
            -DBoost_NO_SYSTEM_PATHS=ON \
            -DBoost_USE_STATIC_LIBS=ON

          cmake --build build --config "${BUILD_TYPE}"

      - name: Run CTest
        uses: threeal/ctest-action@v1.1.0
        with:
          test-dir: build
          build-config: ${{ env.BUILD_TYPE }}
          args: "--output-on-failure"

      - name: Upload executable as artifact
        uses: actions/upload-artifact@v4
        with:
          name: yuclid-${{ runner.os }}-${{ matrix.cxx_compiler }}
          path: ${{ runner.os == 'Windows' && format('build/src/{0}/yuclid.exe', env.BUILD_TYPE) || 'build/src/yuclid' }}
          retention-days: 7

      - name: Upload CMake logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cmake-configure-log-${{ runner.os }}-${{ matrix.cxx_compiler }}
          path: build/CMakeFiles/CMakeConfigureLog.yaml
          retention-days: 7
