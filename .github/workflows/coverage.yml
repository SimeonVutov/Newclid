name: Coverage

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    env:
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
      UV_FROZEN: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Collect Python coverage
        run: |
          nix develop --command bash -c \
            "uv run pytest newclid/tests ncdgen/tests yuclid/tests -n auto -m 'not slow' --cov --cov-fail-under=74 --cov-report=xml --cov-report=term-missing"

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: coverage.xml
          if-no-files-found: ignore

      - name: Upload coverage to Codacy
        continue-on-error: true
        env:
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
        if: >-
          ${{
            github.repository == 'Newclid/Newclid' &&
            github.event_name == 'push' &&
            env.CODACY_PROJECT_TOKEN != ''
          }}
        uses: codacy/codacy-coverage-reporter-action@v1.3.0
        with:
          project-token: ${{ env.CODACY_PROJECT_TOKEN }}
          coverage-reports: coverage.xml
