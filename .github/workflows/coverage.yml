name: Coverage
on: ["push"]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  engine:
    name: Engine Python coverage
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Run engine tests with coverage
        # Scope (newclid/src, ncdgen/src, yuclid/python) comes from
        # [tool.coverage.run] in the root pyproject, so this already includes
        # the yuclid python binding tests. Keeps the original 74% gate.
        run: |
          nix develop --command bash -c "uv run pytest -n auto -m 'not slow' --ignore=backend --cov --cov-fail-under=74 --cov-report=xml:coverage-engine.xml"
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-engine
          path: coverage-engine.xml
  backend:
    name: Backend Python coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        # GitHub waits for this to be healthy before starting the job.
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Run backend tests with coverage
        run: |
          nix develop --command bash -c "uv run pytest backend/tests --cov=newclid_backend --cov-report=xml:coverage-backend.xml"
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-backend
          path: coverage-backend.xml
  frontend:
    name: Frontend coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Run frontend tests with coverage
        # Vitest emits cobertura (configured in vitest.config.ts).
        run: |
          npm ci
          npm run test:coverage
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend
          path: frontend/coverage/cobertura-coverage.xml
  yuclid-cpp:
    name: Yuclid C++ coverage
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install build and coverage dependencies
        # Direct apt install (not nix): the C++ side already uses apt in
        # compile-cpp.yml, so this matches the toolchain used elsewhere
        # for C++ and avoids pulling nix in just for gcov.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build \
            libboost-dev libboost-log-dev libboost-json-dev \
            libboost-program-options-dev libboost-test-dev \
            gcc-14 g++-14 gcovr ca-certificates
      - name: Configure instrumented build
        run: |
          cmake -S yuclid -B yuclid/build-coverage -G Ninja \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_DOC=OFF \
            -DCMAKE_CXX_FLAGS="--coverage -O0 -g -fprofile-abs-path" \
            -DCMAKE_EXE_LINKER_FLAGS="--coverage"
      - name: Build
        run: cmake --build yuclid/build-coverage --parallel "$(nproc)"
      - name: Run CTest suite
        run: ctest --test-dir yuclid/build-coverage --output-on-failure --parallel "$(nproc)"
      - name: Generate cobertura report
        run: |
          gcovr --root yuclid \
            --object-directory yuclid/build-coverage \
            --gcov-executable gcov-14 \
            --filter yuclid/src \
            --cobertura coverage-cpp.xml \
            --print-summary
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-cpp
          path: coverage-cpp.xml
  report:
    name: Upload combined report to Codacy
    runs-on: ubuntu-latest
    needs: [engine, backend, frontend, yuclid-cpp]
    env:
      CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
    steps:
      - name: Download coverage reports
        uses: actions/download-artifact@v4
        with:
          path: reports
      - name: Upload to Codacy
        # Best-effort: skipped without a token (forks), never fails the
        # pipeline. Given multiple reports, the reporter combines them.
        if: env.CODACY_PROJECT_TOKEN != ''
        continue-on-error: true
        uses: codacy/codacy-coverage-reporter-action@v1.3.0
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: reports/coverage-engine/coverage-engine.xml,reports/coverage-backend/coverage-backend.xml,reports/coverage-frontend/cobertura-coverage.xml,reports/coverage-cpp/coverage-cpp.xml
